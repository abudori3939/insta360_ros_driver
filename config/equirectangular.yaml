equirectangular_node:
  ros__parameters:
    cx_offset: 0.0
    cy_offset: 0.0
    # Diameter of one fisheye circle in the dual-fisheye image.
    # X5 streams 2656x1328, so each fisheye is 1328 px (960 was for the 1920x960 X2/X3 stream).
    crop_size: 1328
    translation: [0.0, 0.0, -0.105]
    rotation_deg: [-0.5, 0.0, 1.1]
    gpu: true
    out_width: 1920
    out_height: 960
    # Publish rate ceiling. The camera streams at 30 fps but projecting every frame
    # costs several CPU cores; 10 Hz matches a typical LiDAR and leaves latency alone,
    # since the throttle always projects the newest frame rather than a queued one.
    # Set to 0.0 to project everything.
    max_rate: 10.0
    # nearest | linear | cubic
    interpolation: linear